[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baize-core"
version = "0.1.0"
description = "白泽云析共享清洗规则（全平台唯一副本）"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["baize_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
